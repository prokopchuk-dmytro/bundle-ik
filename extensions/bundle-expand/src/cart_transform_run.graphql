query CartTransformRunInput {
  cart {
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          metafield(namespace: "bundle", key: "components") { value }
          product {
            metafield(namespace: "bundle", key: "components") { value }
          }
        }
      }
    }
  }
}
